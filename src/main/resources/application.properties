# =============================================
# APPLICATION CONFIG
# =============================================
spring.application.name=taskapp-backend
server.port=8080

# =============================================
# DATABASE CONFIG — Values from Secret Manager
# =============================================
spring.datasource.url=${sm://DB_URL}
spring.datasource.username=${sm://DB_USERNAME}
spring.datasource.password=${sm://DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# =============================================
# JPA / HIBERNATE CONFIG
# =============================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# =============================================
# FLYWAY — DB MIGRATIONS
# =============================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# =============================================
# ACTUATOR — Health checks
# =============================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# =============================================
# GCP PROJECT
# =============================================
spring.cloud.gcp.project-id=taskapp-dev-001
